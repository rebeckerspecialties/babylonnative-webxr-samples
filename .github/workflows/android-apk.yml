name: Build WebXR sample APK
on:
  push:
    branches: [main, android/compositor-layers, review/streaming-video-pixels]
  workflow_dispatch:
  workflow_call:
    inputs:
      samples-ref:
        description: Exact WebXR samples revision to build
        type: string
        required: true
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rebeckerspecialties/babylonnative-webxr-samples
          ref: ${{ inputs.samples-ref || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: |
          rustup target add aarch64-linux-android
          sdkmanager 'platforms;android-34' 'platforms;android-35' 'ndk;29.0.14206865' 'cmake;3.22.1'
          npm ci
          node --test *.test.cjs *.test.mjs
          python3 -m unittest discover -s android -p test_layer_pacing.py
      - name: Verify stereo display matching and missing-eye controls
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          python3 -m venv "$RUNNER_TEMP/check-display"
          "$RUNNER_TEMP/check-display/bin/pip" install --only-binary=:all: opencv-python-headless==4.11.0.86
          "$RUNNER_TEMP/check-display/bin/python" -m unittest discover -s android -p 'test_*.py'
          "$RUNNER_TEMP/check-display/bin/python" android/display-regressions.py
          "$RUNNER_TEMP/check-display/bin/python" android/check-video-display.py --markers qualification/quest-1/identified-film-max-foveation.jpg
          "$RUNNER_TEMP/check-display/bin/python" android/video-display-regressions.py
      - run: bash third_party/BabylonNative/Apps/Playground/Android/gradlew -p android :app:assembleQualification -PARM64Only -PjsEngine=V8
      - run: python3 android/check-apk.py android/app/build/outputs/apk/qualification/app-qualification.apk
      - name: Verify the actual packaged cube faces against the original atlas
        run: |
          for atlas in mono_cube_map.png stereo_cube_map.png; do
            unzip -p android/app/build/outputs/apk/qualification/app-qualification.apk "assets/Scripts/layer-images/$atlas" > "$RUNNER_TEMP/$atlas"
            "$RUNNER_TEMP/check-display/bin/python" android/check-cube.py "third_party/webxr-samples/media/textures/$atlas" "$RUNNER_TEMP/$atlas"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: webxr-vulkan-arm64
          path: android/app/build/outputs/apk/qualification/app-qualification.apk
          if-no-files-found: error
