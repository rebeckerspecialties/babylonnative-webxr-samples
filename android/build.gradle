plugins {
    id 'com.android.application' version '9.0.1' apply false
    id 'com.android.library' version '9.0.1' apply false
}
project(':BabylonNative').plugins.withId('com.android.library') {
    project(':BabylonNative').androidComponents.finalizeDsl { dsl ->
        dsl.defaultConfig.externalNativeBuild.cmake.targets.add('BabylonNativeEmbedding')
    }
}
